# @package _global_
#
# Joint LoopWAM + mixed-quality training with quality-weighted action supervision.
# Run (example):
#   python scripts/train.py task=robotwin
#   bash train_robotwin_loopwam.sh

defaults:
  - override /data: robotwin
  - override /model: fastwam_joint_mixed_quality_weighted
  - _self_

batch_size: 16
num_workers: 12

model:
  mot_checkpoint_mixed_attn: false

lr_scheduler_type: "cosine"
learning_rate: 1e-4
num_epochs: 5
max_steps: null
log_every: 10
save_every: 2500
eval_every: 500

gradient_accumulation_steps: 1
weight_decay: 1e-2
resume: null
